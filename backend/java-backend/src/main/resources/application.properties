spring.application.name=tender-backend

# --- Połączenie z bazą PostgreSQL (Docker / Local fallback) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tender_db}
spring.datasource.username=${DB_USERNAME:tender_user}
spring.datasource.password=${DB_PASSWORD:tender_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Klucz dostępu dla workera w Pythonie ---
app.internal-api-key=${INTERNAL_API_KEY:super_tajny_klucz_python_ingestion_2026}

# --- Konfiguracja JWT ---
# Tajny klucz o długości min. 32 znaków (zmienna środowiskowa z domyślnym fallbackiem)
app.jwt.secret=${JWT_SECRET:moj_super_bezpieczny_sekretny_klucz_jwt_do_podpisywania_tokenow_2026}
# Czas ważności tokenu w milisekundach (np. 24h = 86400000 ms)
app.jwt.expiration-ms=86400000