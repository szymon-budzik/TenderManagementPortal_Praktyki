services:
  python-app:
    container_name: przetargi-gui
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - db

  ingestion-worker:
    container_name: przetargi-worker
    build: .
    command: python ingestion_engine.py
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  db:
    container_name: przetargi-db
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: przetargi_db
    ports:
      - "5432:5432"