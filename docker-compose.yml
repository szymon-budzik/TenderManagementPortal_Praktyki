services:
  python-app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  ingestion-worker:
    build: .
    command: python ingestion_engine.py
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: przetargi_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d przetargi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
